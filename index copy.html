<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>52 причины почему я тебя люблю ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Segoe UI", sans-serif;
}

body{
    background: linear-gradient(135deg,#ffd6e7,#ffeef5);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    text-align:center;
    padding:20px;
}

h1{
    color:#d63384;
    margin-bottom:40px;
    font-size:2.2rem;
}

.jar{
    width:220px;
    height:300px;
    margin:auto;
    position:relative;
    cursor:pointer;
    transition:.25s;
}

.jar:hover{
    transform:scale(1.05);
}

.lid{
    width:170px;
    height:35px;
    background:#ff7eb6;
    border-radius:12px;
    margin:auto;
}

.body{
    width:190px;
    height:240px;
    margin:auto;
    background:rgba(255,255,255,.55);
    border:5px solid #ff7eb6;
    border-radius:30px;
    backdrop-filter: blur(6px);
    position:relative;
    overflow:hidden;
}

.paper{
    position:absolute;
    width:38px;
    height:18px;
    background:white;
    border-radius:4px;
    transform:rotate(var(--r));
}

.paper:nth-child(1){left:20px;top:30px;--r:12deg;}
.paper:nth-child(2){left:90px;top:45px;--r:-10deg;}
.paper:nth-child(3){left:50px;top:80px;--r:8deg;}
.paper:nth-child(4){left:120px;top:95px;--r:-14deg;}
.paper:nth-child(5){left:35px;top:145px;--r:5deg;}
.paper:nth-child(6){left:105px;top:165px;--r:-6deg;}
.paper:nth-child(7){left:65px;top:190px;--r:15deg;}
.paper:nth-child(8){left:135px;top:55px;--r:18deg;}
.paper:nth-child(9){left:18px;top:100px;--r:-8deg;}
.paper:nth-child(10){left:145px;top:135px;--r:11deg;}

#reason{
    margin-top:35px;
    background:white;
    display:inline-block;
    padding:18px 24px;
    border-radius:18px;
    max-width:700px;
    font-size:1.2rem;
    color:#d63384;
    font-weight:600;
    min-height:80px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
    transition:.3s;
}

.tip{
    margin-top:15px;
    color:#a44c74;
}
</style>

</head>
<body>

<div class="container">
    <h1>💖 52 причины почему я тебя люблю 💖</h1>

    <div class="jar" onclick="showReason()">
        <div class="lid"></div>
        <div class="body">
            <div class="paper"></div>
            <div class="paper"></div>
            <div class="paper"></div>
            <div class="paper"></div>
            <div class="paper"></div>
            <div class="paper"></div>
            <div class="paper"></div>
            <div class="paper"></div>
            <div class="paper"></div>
            <div class="paper"></div>
        </div>
    </div>

    <p class="tip">Нажми на баночку ✨</p>

    <div id="reason">
        Здесь появится одна из 52 причин ❤️
    </div>
</div>

<script>

let last = -1;

function showReason(){
    let index;
    do{
        index = Math.floor(Math.random()*reasons.length);
    }while(index===last);

    last=index;

    const card=document.getElementById("reason");
    card.style.transform="scale(0.9)";
    card.style.opacity="0";

    setTimeout(()=>{
        card.innerHTML="💌 " + reasons[index];
        card.style.transform="scale(1)";
        card.style.opacity="1";
    },180);
}
</script>

</body>
</html>
